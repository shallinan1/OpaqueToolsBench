[project]
name = "opaquetoolsbench"
version = "0.1.0"
description = "OpaqueToolsBench: learning the meaning of opacified tools through interaction"
requires-python = "==3.10.*"

# ----------------------------------------------------------------------------
# CORE dependencies (default `uv sync`).
#
# This is the lightweight tier needed for *offline inspection*, *re-grading the
# shipped trajectories*, and *reproducing the paper tables* across all three
# domains — plus API-based (OpenAI / Anthropic / etc.) agent runs for BFCL and
# Chess. It installs cleanly on macOS (Intel + Apple Silicon), Linux, and
# Windows because it pulls no GPU / serving stack.
#
# Heavier capabilities are split into optional groups below:
#   - `[local-llm]`  : run agents against locally-served models (vLLM + torch)
#   - `[retrieval]`  : BrowseCompPlus FAISS/BM25 retrieval (faiss, pyserini, …)
#   - `[metrics]`    : description-similarity metrics for Table 6 (SBERT/NLI)
#
# Install examples:
#   uv sync                          # core only — inspect, re-grade, tables
#   uv sync --extra retrieval        # + BrowseCompPlus retrieval backends
#   uv sync --extra local-llm        # + local model serving (needs GPU)
#   uv sync --all-extras             # everything (Linux + GPU recommended)
# ----------------------------------------------------------------------------
dependencies = [
    # Data / plotting / utils
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.67.1",
    "rich>=14.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.1.1",
    # Chess engine bindings + scoring
    "python-chess>=1.0.0",
    # LLM provider SDKs. The BFCL eval vendor (Gorilla) eagerly imports a
    # handler module per provider, so all four must be importable even for an
    # OpenAI-only run. mistralai is pinned to the last 0.x release because the
    # vendor uses `mistralai.client.MistralClient`, removed in mistralai>=1.0.
    "openai>=1.97.0",
    "anthropic>=0.58.2",
    "cohere==5.5.8",
    "mistralai==0.4.2",
    "together>=1.5.25",
    "tiktoken>=0.7.0",
    "aiohttp>=3.9.0",
    # BFCL eval AST parsing. tree-sitter is pinned to 0.21.x: the 0.22 release
    # removed the 2-argument `Language(ptr, name)` constructor the vendor uses.
    "tree-sitter==0.21.3",
    "tree-sitter-java==0.21.0",
    "tree-sitter-javascript==0.21.4",
]

[project.optional-dependencies]
# BrowseCompPlus retrieval backends (FAISS dense + BM25/Pyserini). Needed to
# *run* BrowseCompPlus agents or rebuild the index; not needed to re-grade
# shipped BCP trajectories. Pyserini also requires a JDK 21 runtime (see SETUP).
retrieval = [
    "faiss-cpu>=1.11.0.post1",
    "pyserini>=1.2.0",
    "datasets>=4.0.0",
    "tevatron",
    "google-genai>=1.27.0",
    "fastmcp==2.9.2",
    "pyngrok>=7.2.12",
]

# Local-LLM serving (run agents against a locally-hosted model instead of an
# API). Heavy GPU stack: torch/vLLM wheels are Linux+CUDA or Apple-Silicon only
# (no x86_64-macOS wheels), so install this on a GPU Linux box.
local-llm = [
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.53.2",
    "accelerate>=1.9.0",
    "deepspeed>=0.17.2",
    "peft>=0.16.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.1",
    "vllm>=0.9.0",
    "qwen-agent[gui,mcp,rag]==0.0.27",
    "qwen-omni-utils==0.0.8",
]

# Description-similarity metrics (Table 6: semantic SBERT + NLI). GPU required;
# no CPU fallback.
metrics = [
    "torch>=2.0.0",
    "transformers>=4.53.2",
    "sentence-transformers>=3.0.0",
]

[tool.uv.sources]
tevatron = { git = "https://github.com/texttron/tevatron.git", rev = "main" }
